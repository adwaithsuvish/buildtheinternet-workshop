<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build the Internet</title>
  <style>
    :root{color-scheme:dark;--bg:#09111f;--panel:#111f34;--line:#294260;--muted:#9db0c8;--blue:#4f8cff;--green:#42d392;--yellow:#f7c948;--red:#fb7185}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.5 Inter,system-ui,sans-serif;color:#f4f7fb;background:radial-gradient(circle at 10% 0,#193c65,transparent 38%),var(--bg)}
    .shell{max-width:1100px;margin:auto;padding:38px 20px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#72a9ff;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.05;margin:8px 0}.hero p{max-width:640px;color:var(--muted);font-size:18px}.ready{border:1px solid #31598d;border-radius:99px;padding:7px 12px;color:#9cc4ff;white-space:nowrap}.ready:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--green)}
    .layout{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:28px}.panel{background:#111f34e8;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 15px 40px #0003}.panel h2{font-size:16px;margin:0 0 20px;color:#d7e7ff}.field{margin:15px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #426181;border-radius:9px;background:#091728;color:#fff;font:inherit}.field input:focus{outline:2px solid var(--blue);border-color:transparent}button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--blue);color:#fff;font:700 15px inherit;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.55;cursor:wait}
    .flow-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.flow-head h2{margin:0}.live{font-size:13px;color:var(--green)}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{min-height:112px;padding:13px;border:1px solid #34506e;border-radius:11px;background:#15283f;transition:.2s}.step b{display:block}.step small{display:block;margin-top:8px;color:var(--muted)}.pending{opacity:.5}.active{border-color:var(--yellow);background:#302817}.done{border-color:var(--green);background:#123326}.failed{border-color:var(--red);background:#381c29}
    .log-wrap{margin-top:18px}.log-title{display:flex;justify-content:space-between;align-items:center}.log-title button{width:auto;padding:5px 9px;background:#294260;font-size:12px}.log{min-height:90px;white-space:pre-wrap;color:#a7f3d0;font:13px/1.7 ui-monospace,monospace}.error{color:#ff9aaa}
    @media(max-width:800px){.hero{display:block}.ready{display:inline-block;margin-top:10px}.layout{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.steps{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><div><div class="eyebrow">ACM · Network workshop</div><h1>🌐 Build the Internet</h1><p>Watch service discovery and authentication happen in real time. Backend addresses are resolved dynamically through DNS.</p></div><div class="ready">Client ready</div></header>
    <div class="layout">
      <section class="panel"><h2>Connection details</h2>
        <div class="field"><label for="dns">DNS service address</label><input id="dns" placeholder="http://192.168.1.10:8053" required></div>
        <div class="field"><label for="port">Fallback server port</label><input id="port" value="8002" inputmode="numeric"></div>
        <h2>Account</h2>
        <div class="field"><label for="user">Username</label><input id="user" value="alice" autocomplete="username" required></div>
        <div class="field"><label for="pass">Password</label><input id="pass" type="password" value="secret123" autocomplete="current-password" required></div>
        <button id="start">Start authentication flow</button>
      </section>
      <section><div class="flow-head"><h2>Network flow</h2><span class="live">● Live events</span></div><div id="steps" class="steps"></div>
        <div class="panel log-wrap"><div class="log-title"><strong>Event log</strong><button id="clear">Clear</button></div><div id="log" class="log" aria-live="polite">Waiting to start...</div></div>
      </section>
    </div>
  </main>
  <script>
    const names=[["dns","🔎 DNS lookup","Resolve acm-server"],["login","🔐 Login","Authenticate user"],["register","📝 Register","Create account if needed"],["retry","🔁 Retry login","Use new account"],["whoami","✅ Verify session","Confirm identity"]];
    const steps=document.querySelector("#steps"),log=document.querySelector("#log"),start=document.querySelector("#start");
    steps.innerHTML=names.map(([id,label,desc])=>`<div id="${id}" class="step pending"><b>${label}</b><small>${desc}</small></div>`).join("");
    function mark(id,state){document.getElementById(id).className="step "+state}
    function say(text){if(log.textContent==="Waiting to start...")log.textContent="";log.textContent+=text+"\\n"}
    async function request(url,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6000);try{const response=await fetch(url,{...options,signal:controller.signal});let data={};try{data=await response.json()}catch{}return{response,data}}finally{clearTimeout(timer)}}
    async function flow(){start.disabled=true;names.forEach(([id])=>mark(id,"pending"));log.textContent="";
      const dns=document.querySelector("#dns").value.replace(/\\/$/,""),port=document.querySelector("#port").value,user=document.querySelector("#user").value,pass=document.querySelector("#pass").value;
      try{if(!dns||!user||!pass)throw Error("Please complete all required fields.");
        mark("dns","active");say("Looking up acm-server through acm-dns...");const lookup=await request(`${dns}/lookup?domain=acm-server`);if(!lookup.response.ok)throw Error(lookup.data.error||"DNS lookup failed");
        let server=lookup.data.destination;if(!/^https?:\\/\\//.test(server))server="http://"+server+":"+port;mark("dns","done");say("Resolved acm-server → "+server);
        mark("login","active");let result=await request(`${server}/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,password:pass})});
        if(result.response.status===401){mark("login","done");mark("register","active");say("User not found; registering...");result=await request(`${server}/register`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,password:pass})});if(!result.response.ok&&result.response.status!==400)throw Error(result.data.error||"Registration failed");mark("register","done");mark("retry","active");say("Registration complete; retrying login...");result=await request(`${server}/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user,password:pass}))}
        if(!result.response.ok)throw Error(result.data.error||"Login failed");mark("login","done");mark("retry","done");mark("whoami","active");const who=await request(`${server}/whoami`,{credentials:"include"});if(!who.response.ok)throw Error(who.data.error||"Session verification failed");mark("whoami","done");say(`Authenticated as ${who.data.username} (user ${who.data.user_id}).`);
      }catch(error){say("❌ "+(error.name==="AbortError"?"Request timed out. Check the service address.":error.message));names.forEach(([id])=>{if(document.getElementById(id).classList.contains("active"))mark(id,"failed")})}finally{start.disabled=false}
    }
    start.onclick=flow;document.querySelector("#clear").onclick=()=>{log.textContent="Waiting to start...";names.forEach(([id])=>mark(id,"pending"))};
  </script>
</body>
</html>
